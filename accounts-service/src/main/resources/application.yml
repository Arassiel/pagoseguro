spring:
  application:
    name: accounts-service
  config:
    # Lee la contraseña desde el .env de la raíz del monorepo (ejecutando desde accounts-service/).
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=pagoseguro;encrypt=true;trustServerCertificate=true}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:${MSSQL_SA_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway crea las tablas; Hibernate solo verifica que la entidad coincida con la tabla.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: 8081

# Reglas de negocio configurables (sin recompilar).
pagoseguro:
  business-zone: America/Santiago
  transfers:
    daily-limit: 2000000.00   # CLP por cuenta y por día

management:
  endpoints:
    web:
      exposure:
        include: health,info
