name: pagoseguro

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pagoseguro-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Crea la base de datos "pagoseguro" una sola vez (SQL Server no lo hace por variable de entorno).
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pagoseguro-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    entrypoint: >
      /bin/bash -c "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -C
      -Q \"IF DB_ID('pagoseguro') IS NULL CREATE DATABASE pagoseguro;\""
    restart: "no"

volumes:
  sqlserver-data:
